<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MayurPawar Edits — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

    authDomain: "mayurpawaredits.firebaseapp.com",
    databaseURL: "https://mayurpawaredits-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mayurpawaredits",
    storageBucket: "mayurpawaredits.firebasestorage.app",
    messagingSenderId: "317017893798",
    appId: "1:317017893798:web:8e2b4e0ab2e528d4383d67",
    measurementId: "G-FZBBMHFNRS"
  };
  firebase.initializeApp(firebaseConfig);
</script>
<style>
  :root{
    --bg: #0a1420;
    --bg-panel: #101e30;
    --bg-panel-2: #16273d;
    --line: #22364d;
    --teal: #4fd1e3;
    --teal-deep: #1f8a99;
    --gold: #dab45c;
    --gold-deep: #a9812e;
    --text: #f2f6fa;
    --text-muted: #93a8c0;
    --danger: #e2665a;
    --radius: 16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(79,209,227,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(218,180,92,.08), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
  }
  h1,h2,h3{ font-family:'Sora',sans-serif; }
  button{ font-family:inherit; cursor:pointer; }

  header{ border-bottom:1px solid var(--line); background:rgba(10,20,32,.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:10; }
  .header-inner{ max-width:960px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:40px; height:40px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--line); flex-shrink:0; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-text .name{ font-weight:700; font-size:15px; }
  .brand-text .tag{ font-size:11px; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }

  main{ max-width:960px; margin:0 auto; padding:40px 20px; }

  .btn{ border:none; border-radius:999px; padding:11px 22px; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:8px; }
  .btn-primary{ background:linear-gradient(95deg, var(--teal), #37b8cc); color:#04222a; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn-ghost:hover{ border-color:var(--teal); }

  /* Login */
  .login-wrap{ max-width:360px; margin:80px auto; background:var(--bg-panel); border:1px solid var(--line); border-radius:20px; padding:30px; text-align:center; }
  .login-wrap h2{ font-size:19px; margin-bottom:6px; }
  .login-wrap p{ color:var(--text-muted); font-size:13px; margin-bottom:20px; }
  .field{ text-align:left; margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .field input{ width:100%; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; font-family:inherit; }
  .field input:focus{ outline:none; border-color:var(--teal); }
  .form-error{ color:var(--danger); font-size:12.5px; margin-top:10px; display:none; }

  /* Dashboard */
  .dash-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .dash-head h1{ font-size:22px; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px; }
  .stat{ background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat .n{ font-family:'Sora',sans-serif; font-size:24px; font-weight:800; color:var(--gold); }
  .stat .l{ font-size:12px; color:var(--text-muted); margin-top:2px; }

  .order-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .oc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .oc-name{ font-weight:700; font-size:15px; }
  .oc-time{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .oc-total{ color:var(--gold); font-weight:800; font-size:16px; white-space:nowrap; }
  .oc-items{ font-size:13px; color:var(--text-muted); margin-top:10px; line-height:1.7; }
  .oc-items b{ color:var(--text); }
  .oc-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .status-pill{ font-size:11px; padding:3px 10px; border-radius:999px; font-weight:700; }
  .status-pill.new{ background:rgba(218,180,92,.18); color:var(--gold); }
  .status-pill.done{ background:rgba(79,209,227,.15); color:var(--teal); }
  .oc-actions label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); cursor:pointer; }
  .oc-actions a{ font-size:12.5px; color:var(--teal); text-decoration:underline; }
  .delete-btn{ background:none; border:1px solid var(--danger); color:var(--danger); border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600; }
  .delete-btn:hover{ background:rgba(226,102,90,.12); }
  .progress-btn{ background:none; border:1px solid var(--teal-deep); color:var(--teal); border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600; }
  .progress-btn:hover{ background:rgba(79,209,227,.12); }
  .files-btn{ background:var(--bg-panel-2); border:1px solid var(--teal-deep); color:var(--teal); border-radius:10px; padding:8px 14px; font-weight:700; font-size:12.5px; margin-top:10px; }
  .files-btn:hover{ background:rgba(79,209,227,.12); }
  .files-btn:disabled{ opacity:.5; cursor:default; }

  .media-item{ display:inline-block; width:140px; vertical-align:top; margin:10px 8px 0 0; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:8px; }
  .media-item img{ width:100%; height:100px; object-fit:cover; border-radius:8px; margin-bottom:6px; display:block; }
  .media-item video{ width:100%; border-radius:8px; margin-bottom:6px; max-height:140px; }
  .media-item .fn{ font-size:11px; color:var(--text-muted); word-break:break-all; margin-bottom:6px; }
  .media-item a{ font-size:11.5px; color:var(--teal); text-decoration:underline; }

  .empty{ text-align:center; color:var(--text-muted); padding:60px 10px; font-size:14px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark"><img src="logo.jpg" alt="MayurPawar Edits"></div>
      <div class="brand-text">
        <div class="name">MayurPawar Edits</div>
        <div class="tag">Admin dashboard</div>
      </div>
    </div>
    <button class="btn btn-ghost hidden" id="logoutBtn" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <h2>Studio admin login</h2>
    <p>Sign in with your admin account to view orders.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="adminEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="tryLogin()">Sign in</button>
    <div class="form-error" id="loginError">Could not sign in — check your email and password.</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashWrap" class="hidden">
    <div class="dash-head">
      <h1>Orders</h1>
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="loadOrders()">↻ Refresh</button>
        <button class="btn btn-ghost" onclick="enableNotifications()">🔔 Enable alerts on this device</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Total orders</div></div>
      <div class="stat"><div class="n" id="statNew">0</div><div class="l">Not yet contacted</div></div>
      <div class="stat"><div class="n" id="statRevenue">₹0</div><div class="l">Total order value</div></div>
    </div>

    <div id="ordersList"></div>
  </div>
</main>

<script>
function fmt(n){ return '₹' + n.toLocaleString('en-IN'); }

function tryLogin(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .catch(e=>{
      console.error(e);
      err.textContent = e.message || 'Could not sign in — check your email and password.';
      err.style.display = 'block';
    });
}

function logout(){
  firebase.auth().signOut();
}

let ordersCache = {}; // key -> order object
let initialLoaded = false;
const ordersRef = firebase.database().ref('orders');

firebase.auth().onAuthStateChanged(async user=>{
  if(user){
    let isAdmin = false;
    try{
      const snap = await firebase.database().ref('admins/' + user.uid).get();
      isAdmin = snap.exists() && snap.val() === true;
    }catch(e){ isAdmin = false; }

    if(!isAdmin){
      const err = document.getElementById('loginError');
      err.textContent = 'This account is not authorized for admin access.';
      err.style.display = 'block';
      firebase.auth().signOut();
      return;
    }

    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('dashWrap').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    attachOrderListeners();
  }else{
    document.getElementById('dashWrap').classList.add('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('adminPass').value = '';
    initialLoaded = false;
    ordersCache = {};
  }
});

function attachOrderListeners(){
  ordersRef.on('value', snapshot=>{
    ordersCache = snapshot.val() || {};
    renderOrders();
    initialLoaded = true;
  });
  ordersRef.on('child_added', snapshot=>{
    if(initialLoaded && 'Notification' in window && Notification.permission === 'granted'){
      const o = snapshot.val();
      new Notification('New order received!', { body: `${o.name} · ${fmt(o.total)}` });
    }
  });
}

function loadOrders(){ /* kept for the Refresh button — data is already live via onValue */ }

function renderOrders(){
  const listEl = document.getElementById('ordersList');
  const orders = Object.entries(ordersCache)
    .map(([key,o])=>({ key, ...o }))
    .sort((a,b)=> (b.ts||0) - (a.ts||0));

  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statNew').textContent = orders.filter(o=>!o.contacted).length;
  document.getElementById('statRevenue').textContent = fmt(orders.reduce((s,o)=>s+(o.total||0),0));

  if(orders.length === 0){
    listEl.innerHTML = '<div class="empty">No orders yet. New orders placed on the website will show up here.</div>';
    return;
  }

  listEl.innerHTML = orders.map(o=>{
    const itemsHtml = (o.items||[]).map(i=>`${i.name} × ${i.qty} — ${fmt(i.price*i.qty)}`).join('<br>');
    const notesHtml = o.notes ? `<br><b>Notes:</b> ${o.notes}` : '';
    const waLink = `https://wa.me/${(o.phone||'').replace(/\D/g,'')}`;
    const files = o.files || [];
    const ok = files.filter(f=>f.url);
    const failed = files.length - ok.length;

    let filesHtml = '';
    if(files.length > 0){
      filesHtml = `<div class="media-grid" style="margin-top:10px">` + ok.map(m=>{
        const isImage = m.type && m.type.startsWith('image/');
        const isVideo = m.type && m.type.startsWith('video/');
        const preview = isImage ? `<img src="${m.url}">`
          : isVideo ? `<video src="${m.url}" controls></video>` : '';
        return `<div class="media-item">${preview}<div class="fn">${m.name}</div><a href="${m.url}" target="_blank">Open / download</a></div>`;
      }).join('') + '</div>' +
      (failed ? `<div style="font-size:11.5px;color:var(--danger);margin-top:6px">${failed} file(s) failed to upload — ask the customer to resend on WhatsApp.</div>` : '');
    }

    return `
    <div class="order-card">
      <div class="oc-top">
        <div>
          <div class="oc-name">${o.name} · ${o.phone}</div>
          <div class="oc-time">${o.ts ? new Date(o.ts).toLocaleString('en-IN') : ''}</div>
        </div>
        <div class="oc-total">${fmt(o.total)}</div>
      </div>
      <div class="oc-items"><b>Items:</b><br>${itemsHtml}${notesHtml}</div>
      ${filesHtml}
      <div class="oc-actions">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="status-pill ${o.contacted ? 'done' : 'new'}">${o.contacted ? 'Contacted' : 'New'}</span>
          <span class="status-pill ${o.progress === 'complete' ? 'done' : 'new'}">${o.progress === 'complete' ? 'Work complete' : 'In progress'}</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <a href="${waLink}" target="_blank">Message on WhatsApp</a>
          <label><input type="checkbox" ${o.contacted ? 'checked' : ''} onchange="toggleContacted('${o.key}', this.checked)"> Mark contacted</label>
          <button class="progress-btn" onclick='toggleProgress("${o.key}")'>${o.progress === 'complete' ? '↩ Mark incomplete' : '✅ Mark complete'}</button>
          <button class="delete-btn" onclick='deleteOrder("${o.key}")'>🗑 Delete order</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleContacted(key, value){
  firebase.database().ref('orders/' + key + '/contacted').set(value);
}

function toggleProgress(key){
  const o = ordersCache[key];
  if(!o) return;
  const next = o.progress === 'complete' ? 'incomplete' : 'complete';
  firebase.database().ref('orders/' + key + '/progress').set(next);
}

async function deleteOrder(key){
  const order = ordersCache[key];
  if(!order) return;
  const sure = confirm(`Delete the order from ${order.name}? This permanently removes it and any attached photos/videos. This can't be undone.`);
  if(!sure) return;

  // best-effort: remove uploaded files from Storage too, so nothing orphaned sits in your bucket
  const files = order.files || [];
  for(const f of files){
    if(!f.url) continue;
    try{
      await firebase.storage().refFromURL(f.url).delete();
    }catch(e){
      console.warn('Could not delete file from storage', f.name, e);
    }
  }

  try{
    await firebase.database().ref('orders/' + key).remove();
  }catch(e){
    alert('Could not delete this order: ' + (e.message || e));
  }
}

function enableNotifications(){
  if(!('Notification' in window)){ alert('Notifications are not supported on this device.'); return; }
  Notification.requestPermission();
}
</script>
</body>
</html>
